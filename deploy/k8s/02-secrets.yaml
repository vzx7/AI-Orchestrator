apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: ai-orchestrator
  labels:
    app.kubernetes.io/name: ai-orchestrator
type: Opaque
stringData:
  API_KEY: "change-me-generate-secure-random-key"
  POSTGRES_PASSWORD: "change-me-secure-password"
  POSTGRES_USER: "admin"
  POSTGRES_DB: "orchestrator"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"