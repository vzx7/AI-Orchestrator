apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-orchestrator

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secrets.yaml
  - 08-pvc.yaml
  - 09-init-configmap.yaml
  - 03-postgres.yaml
  - 04-redis.yaml
  - 05-orchestrator.yaml
  - 06-workers.yaml
  - 07-hpa.yaml

commonLabels:
  app.kubernetes.io/name: ai-orchestrator
  app.kubernetes.io/version: "5.0.0"

configMapGenerator:
  - name: orchestrator-config
    behavior: merge
    literals:
      - VERSION=latest

images:
  - name: ghcr.io/your-org/orchestrator
    newTag: latest
  - name: ghcr.io/your-org/orchestrator-worker
    newTag: latest

replicas:
  - name: postgres
    count: 1
  - name: redis
    count: 1