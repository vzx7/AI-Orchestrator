apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-orchestrator
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/your-org/orchestrator-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ORCHESTRATOR_URL
          value: "http://orchestrator:8080"
        envFrom:
        - secretRef:
            name: orchestrator-secrets
        livenessProbe:
          exec:
            command:
            - true
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - true
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: ai-orchestrator
  labels:
    app.kubernetes.io/name: worker
spec:
  ports:
  - port: 50051
    targetPort: 50051
    name: grpc
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker