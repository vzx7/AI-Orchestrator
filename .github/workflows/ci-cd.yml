name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Lint and Test
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linter
        run: golangci-lint run ./...

      - name: Check formatting
        run: |
          gofmt -l . 
          if [ -n "$(gofmt -l .)" ]; then 
            echo "Run 'gofmt -w .' to fix formatting"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ============================================
  # Build Docker Images
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        target: [orchestrator, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{ is_default_branch }}
            type=raw,value=${{ github.ref_name }},enable={{ is_default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Build (pull request only - no push)
  # ============================================
  build-pr:
    name: Build PR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: orchestrator
          load: true

      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: worker
          load: true

  # ============================================
  # Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to kind/dev cluster
        run: |
          echo "Deploying to development cluster..."
          # Example: kubectl apply -k ./deploy/k8s/
          # Or use your deployment tool (terraform,helm,etc.)

      - name: Wait for deployment
        run: |
          echo "Waiting for rollout..."
          # kubectl rollout status deployment/orchestrator -n ai-orchestrator

      - name: Health check
        run: |
          curl -f http://localhost:8080/health || exit 1

  # ============================================
  # Deploy to Production
  # ============================================
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production cluster
        run: |
          echo "Deploying to production cluster..."
          # kubectl apply -k ./deploy/k8s/

      - name: Wait for deployment
        run: |
          echo "Waiting for rollout..."

      - name: Verify deployment
        run: |
          curl -f http://localhost:8080/health || exit 1

  # ============================================
  # Update Giants
  # ============================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: true
          prerelease: false